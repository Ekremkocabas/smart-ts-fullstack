<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord opnieuw instellen — Signybon</title>
<link rel="icon" type="image/png" href="/favicon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0F172A;--navy-light:#1E293B;
  --green:#22C55E;--green-dark:#16A34A;
  --white:#FFFFFF;--gray-light:#E2E8F0;
  --text-dark:#0F172A;--text-muted:#94A3B8;
  --border:#CBD5E1;
}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--gray-light);color:var(--text-dark);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:18px 40px;display:flex;align-items:center;gap:14px}
.header img.logo-icon{height:46px;width:46px;display:block;flex-shrink:0}
.header .brand{color:var(--white);font-size:22px;font-weight:800;letter-spacing:1px}
.brand-tagline{color:rgba(255,255,255,.6);font-size:12px;margin-left:auto;font-weight:500}
.container{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 20px}
.brand-block{text-align:center;margin-bottom:24px}
.brand-block img{width:88px;height:88px;display:block;margin:0 auto 14px;border-radius:18px;box-shadow:0 8px 20px rgba(15,23,42,.18)}
.brand-block h1{color:var(--navy);font-size:26px;font-weight:800;margin-bottom:6px}
.brand-block p{color:var(--text-muted);font-size:14px;font-weight:500}
.card{background:var(--white);padding:36px 40px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);width:100%;max-width:440px}
.card h2{margin:0 0 14px;color:var(--navy);font-size:20px;text-align:center;font-weight:700}
.card .intro{color:var(--text-muted);font-size:14px;text-align:center;margin-bottom:22px}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:8px;color:var(--text-dark);font-weight:500;font-size:14px}
.form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text-dark);background:var(--white)}
.form-group input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.btn-submit{width:100%;background:var(--green);color:var(--white);border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:background-color .2s}
.btn-submit:hover{background:var(--green-dark)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert.show{display:block}
.below{text-align:center;margin-top:24px;font-size:14px}
.below a{color:var(--navy);text-decoration:none;font-weight:500}
.below a:hover{text-decoration:underline}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){.header{padding:16px 20px}.card{padding:28px 24px}.brand-block img{width:72px;height:72px}}
</style>
</head>
<body>
<div class="header">
  <img class="logo-icon" src="/icon-white.png?v=4" alt="">
  <div class="brand">SIGNYBON</div>
  <div class="brand-tagline">Het digitale werkbonplatform</div>
</div>
<div class="container">
  <div class="brand-block">
    <img src="/favicon.png?v=4" alt="">
    <h1>Wachtwoord herstellen</h1>
    <p>Kies een nieuw wachtwoord voor uw account</p>
  </div>
  <div class="card">
    <h2>Nieuw wachtwoord instellen</h2>
    <p class="intro">Minimaal 8 karakters.</p>
    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>
    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="wachtwoord">Nieuw wachtwoord</label>
        <input type="password" id="wachtwoord" placeholder="••••••••" required minlength="8">
      </div>
      <div class="form-group">
        <label for="wachtwoord2">Bevestig nieuw wachtwoord</label>
        <input type="password" id="wachtwoord2" placeholder="••••••••" required minlength="8">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Opslaan</button>
    </form>
    <div class="below"><a href="/login">Terug naar inloggen</a></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const alertErr = document.getElementById('alertError');
const alertSuc = document.getElementById('alertSuccess');

if (!token) {
  alertErr.textContent = 'Geen geldige resetlink. Vraag een nieuwe aan via de inlogpagina.';
  alertErr.classList.add('show');
  document.getElementById('submitBtn').disabled = true;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  alertErr.classList.remove('show');
  alertSuc.classList.remove('show');

  const wachtwoord = document.getElementById('wachtwoord').value;
  const wachtwoord2 = document.getElementById('wachtwoord2').value;

  if (wachtwoord.length < 8) {
    alertErr.textContent = 'Wachtwoord moet minimaal 8 karakters bevatten.';
    alertErr.classList.add('show');
    return;
  }
  if (wachtwoord !== wachtwoord2) {
    alertErr.textContent = 'Wachtwoorden komen niet overeen.';
    alertErr.classList.add('show');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Bezig...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: wachtwoord })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || 'Er is iets misgegaan.');
    }
    alertSuc.textContent = 'Wachtwoord opnieuw ingesteld. U wordt doorgestuurd naar inloggen...';
    alertSuc.classList.add('show');
    setTimeout(() => { window.location.href = '/login?reset=ok'; }, 1500);
  } catch (err) {
    alertErr.textContent = err.message;
    alertErr.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Opslaan';
  }
});
</script>
<script src="/signybon-help.js?v=4"></script>
</body>
</html>
