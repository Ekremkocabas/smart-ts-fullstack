<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Signybon</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1B4332;--green-light:#2D6A4F;--gold:#D4A017;--white:#FFFFFF;--gray-50:#F8F9FA;--gray-200:#E9ECEF;--gray-400:#ADB5BD;--gray-500:#6C757D;--gray-700:#343A40;--gray-800:#212529;--radius:12px;--shadow-lg:0 12px 40px rgba(0,0,0,.12)}
html{font-size:16px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:48px 40px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--green),var(--gold))}
.logo{text-align:center;margin-bottom:8px;font-size:1.5rem;font-weight:800;color:var(--green);display:flex;align-items:center;justify-content:center;gap:10px}
.logo svg{flex-shrink:0}
.subtitle{text-align:center;color:var(--gray-500);font-size:.9rem;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:2px solid var(--gray-200);border-radius:10px;font-size:.95rem;font-family:inherit;transition:all .2s;background:var(--white);color:var(--gray-800)}
.form-group input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(27,67,50,.1)}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--green);color:var(--white);margin-top:8px}
.btn-primary:hover{background:var(--green-light);transform:translateY(-1px);box-shadow:0 4px 16px rgba(27,67,50,.3)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.register-link{text-align:center;margin-top:20px;font-size:.875rem;color:var(--gray-500)}
.register-link a{color:var(--green);font-weight:600;text-decoration:none}
.register-link a:hover{text-decoration:underline}
.alert{padding:12px 16px;border-radius:8px;font-size:.85rem;margin-bottom:16px;display:none}
.alert-error{background:#f8d7da;color:#842029;border:1px solid #f5c2c7}
.alert-success{background:#d1e7dd;color:#0f5132;border:1px solid #badbcc}
.alert.show{display:block}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){.card{padding:32px 24px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40"><rect x="15" y="15" width="70" height="70" rx="12" ry="12" fill="#D4A017" transform="rotate(45 50 50)"/><rect x="23" y="23" width="54" height="54" rx="9" ry="9" fill="#1B4332" transform="rotate(45 50 50)"/><rect x="36" y="36" width="28" height="28" rx="5" ry="5" fill="#D4A017" transform="rotate(45 50 50)"/></svg> Signybon</div>
  <div class="subtitle">Inloggen op uw account</div>
  <div class="alert alert-success" id="alertSuccess"></div>
  <div class="alert alert-error" id="alertError"></div>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" placeholder="naam@bedrijf.be" required>
    </div>
    <div class="form-group">
      <label for="wachtwoord">Wachtwoord</label>
      <input type="password" id="wachtwoord" placeholder="Uw wachtwoord" required>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">Inloggen</button>
  </form>
  <div class="register-link">Nog geen account? <a href="/register">Registreren</a></div>
</div>

<script>
// Check for verified=1 param
const params = new URLSearchParams(window.location.search);
if (params.get('verified') === '1') {
  const s = document.getElementById('alertSuccess');
  s.textContent = 'Uw e-mailadres is bevestigd! U kunt nu inloggen.';
  s.classList.add('show');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertErr = document.getElementById('alertError');
  const alertSuc = document.getElementById('alertSuccess');
  alertErr.classList.remove('show');
  alertSuc.classList.remove('show');

  const email = document.getElementById('email').value.trim().toLowerCase();
  const wachtwoord = document.getElementById('wachtwoord').value;

  if (!email || !wachtwoord) {
    alertErr.textContent = 'Vul alle velden in.';
    alertErr.classList.add('show');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Bezig...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: wachtwoord })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || 'Inloggen mislukt');
    }
    // Store token and redirect
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/admin';
  } catch (err) {
    alertErr.textContent = err.message;
    alertErr.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Inloggen';
  }
});
</script>
</body>
</html>
