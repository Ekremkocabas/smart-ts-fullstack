<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Signybon</title>
<link rel="icon" type="image/png" href="/favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0F172A;--navy-light:#1E293B;
  --green:#22C55E;--green-dark:#16A34A;
  --white:#FFFFFF;--gray-light:#E2E8F0;
  --text-dark:#0F172A;--text-muted:#94A3B8;
  --border:#CBD5E1;
}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--gray-light);color:var(--text-dark);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:18px 40px;display:flex;align-items:center;gap:14px}
.header img.logo-icon{height:52px;width:52px;display:block;flex-shrink:0}
.header .brand{color:var(--white);font-size:26px;font-weight:800;letter-spacing:1px;font-family:'Poppins',sans-serif}
.brand-tagline{color:rgba(255,255,255,.6);font-size:12px;margin-left:auto;font-weight:500}
.login-container{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.login-card{background:var(--white);padding:40px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.05);width:100%;max-width:420px}
.login-card h2{margin:0 0 24px;color:var(--navy);font-size:24px;text-align:center;font-weight:700}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;color:var(--text-dark);font-weight:500;font-size:14px}
.form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text-dark);background:var(--white)}
.form-group input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.btn-login{width:100%;background:var(--green);color:var(--white);border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:background-color .2s}
.btn-login:hover{background:var(--green-dark)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.below-card{text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.below-card a{text-decoration:none;font-size:14px}
.below-card a.primary{color:var(--navy);font-weight:500}
.below-card a.muted{color:var(--text-muted)}
.below-card a:hover{text-decoration:underline}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert.show{display:block}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){.header{padding:16px 20px}.login-card{padding:32px 24px}}
</style>
</head>
<body>
<div class="header">
  <img class="logo-icon" src="/icon-white.png?v=4" alt="">
  <div class="brand">SIGNYBON</div>
  <div class="brand-tagline">Het digitale werkbonplatform</div>
</div>
<div class="login-container">
  <div class="login-card">
    <h2>Inloggen</h2>
    <div class="alert alert-success" id="alertSuccess"></div>
    <div class="alert alert-error" id="alertError"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" placeholder="naam@bedrijf.be" required>
      </div>
      <div class="form-group">
        <label for="wachtwoord">Wachtwoord</label>
        <input type="password" id="wachtwoord" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login" id="submitBtn">Inloggen</button>
    </form>
  </div>
  <div class="below-card">
    <a href="/register" class="primary">Nog geen account? Registreer nu — 30 dagen gratis</a>
    <a href="/" class="muted">Terug naar homepage</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const verified = params.get('verified');
if (verified === '1') {
  const s = document.getElementById('alertSuccess');
  s.textContent = 'Uw e-mailadres is bevestigd! U kunt nu inloggen.';
  s.classList.add('show');
} else if (verified === 'already') {
  const s = document.getElementById('alertSuccess');
  s.textContent = 'Uw account is al geverifieerd. U kunt inloggen.';
  s.classList.add('show');
} else if (verified === 'expired') {
  const s = document.getElementById('alertError');
  s.textContent = 'Verificatielink is ongeldig of verlopen.';
  s.classList.add('show');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertErr = document.getElementById('alertError');
  const alertSuc = document.getElementById('alertSuccess');
  alertErr.classList.remove('show');
  alertSuc.classList.remove('show');

  const email = document.getElementById('email').value.trim().toLowerCase();
  const wachtwoord = document.getElementById('wachtwoord').value;

  if (!email || !wachtwoord) {
    alertErr.textContent = 'Vul alle velden in.';
    alertErr.classList.add('show');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Bezig...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: wachtwoord })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || 'Inloggen mislukt');
    }
    // Store token + auxiliary data the React panel expects, then redirect.
    // Keys must stay in sync with AuthContext.tsx (loadUser reads these).
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    if (data.platform_access) {
      localStorage.setItem('platformAccess', data.platform_access);
    }
    if (data.plan_info) {
      try { localStorage.setItem('planInfo', JSON.stringify(data.plan_info)); } catch (e) {}
    }
    if (Array.isArray(data.valid_roles)) {
      try { localStorage.setItem('validRoles', JSON.stringify(data.valid_roles)); } catch (e) {}
    }
    if (data.user && data.user.rol === 'platform_admin') {
      window.location.href = '/masterpanel';
    } else {
      // Skip /admin (which redirects on null user during AuthContext hydration)
      // and go straight to the dashboard so the React app finds a logged-in
      // session on first render.
      window.location.href = '/admin/dashboard';
    }
  } catch (err) {
    alertErr.textContent = err.message;
    alertErr.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Inloggen';
  }
});
</script>
<script src="/signybon-help.js"></script>
</body>
</html>
