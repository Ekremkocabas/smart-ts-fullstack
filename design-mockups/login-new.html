<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen - SIGNYBON</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F172A;
    --green: #22C55E;
    --navy-light: #1E293B;
    --gray-light: #E2E8F0;
    --white: #FFFFFF;
    --text-dark: #0F172A;
    --text-muted: #94A3B8;
  }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--gray-light);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .header {
    background-color: var(--navy);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .logo-text {
    color: var(--white);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .login-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .login-card {
    background-color: var(--white);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 400px;
  }
  .login-card h2 {
    margin-top: 0;
    margin-bottom: 24px;
    color: var(--navy);
    font-size: 24px;
    text-align: center;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-dark);
    font-weight: 500;
    font-size: 14px;
  }
  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
  }
  .btn-login {
    width: 100%;
    background-color: var(--green);
    color: var(--white);
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .btn-login:hover {
    background-color: #16a34a;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="../ChatGPT_Image_22_mei_2026__14_40_15.png" alt="SIGNYBON Logo" style="height: 40px; width: auto;">
  </div>
  <div class="login-container">
    <div class="login-card">
      <h2>Inloggen</h2>
      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label>E-mailadres</label>
          <input type="email" placeholder="naam@bedrijf.nl" required>
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Inloggen</button>
      </form>
    </div>
    <div style="text-align: center; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; width: 100%;">
      <a href="#" style="color: var(--navy); text-decoration: none; font-weight: 500; font-size: 14px;">Nog geen account? Registreer nu — 30 dagen gratis</a>
      <a href="landing-new.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Terug naar homepage</a>
    </div>
  </div>
</body>
</html>
