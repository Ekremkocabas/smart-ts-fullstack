<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen - Signybon (Corporate)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #113626;
            --primary-light: #1B4332;
            --accent: #D4A017;
            --bg-color: #E9ECEF;
            --sidebar-bg: #1B4332;
            --sidebar-text: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-main: #212529;
            --text-muted: #495057;
            --border-color: #DEE2E6;
            --border-radius: 4px;
            --shadow: 0 2px 4px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar - Dark theme minified */
        .sidebar { width: 240px; background: var(--sidebar-bg); display: flex; flex-direction: column; color: var(--sidebar-text); position: sticky; top: 0; height: 100vh; }
        .logo-container { padding: 20px; background: var(--primary); border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        .logo { width: 28px; height: 28px; position: relative; transform: rotate(45deg); display: flex; justify-content: center; align-items: center; }
        .logo-outer { width: 100%; height: 100%; background: var(--accent); position: absolute; }
        .logo-middle { width: 70%; height: 70%; background: var(--primary); position: absolute; z-index: 1; }
        .logo-inner { width: 40%; height: 40%; background: var(--accent); position: absolute; z-index: 2; }
        .brand h2 { font-size: 16px; font-weight: 700; color: white; letter-spacing: 1px; }
        .nav-menu { flex: 1; padding: 15px 0; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: #ced4da; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: var(--accent); border-left: 4px solid var(--accent); padding-left: 16px; }

        /* Main Content */
        .main-content { flex: 1; padding: 20px; max-width: 900px; }
        .topbar { background: var(--card-bg); padding: 15px 20px; box-shadow: var(--shadow); border-radius: var(--border-radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .topbar h1 { font-size: 20px; color: var(--primary); margin: 0; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 3px; font-size: 14px; font-weight: 700; cursor: pointer; }

        .panel { background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 25px; }
        .panel-header { background: #f8f9fa; padding: 15px 20px; border-bottom: 1px solid var(--border-color); border-top: 3px solid var(--primary); }
        .panel-header h2 { font-size: 15px; color: var(--primary); margin: 0; font-weight: 700; text-transform: uppercase; }
        .panel-body { padding: 25px; }

        .row { display: flex; gap: 30px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 3px; font-size: 14px; color: var(--text-main); font-family: inherit; }
        
        .logo-box { width: 100px; height: 100px; border: 1px solid var(--border-color); background: #f8f9fa; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        
        .color-row { display: flex; gap: 40px; }
        .color-item { display: flex; align-items: center; gap: 15px; }
        .color-picker { width: 50px; height: 50px; padding: 0; border: 1px solid var(--border-color); cursor: pointer; }

        .integration-box { border: 1px solid var(--border-color); padding: 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #fff; }
        .integration-meta { display: flex; align-items: center; gap: 15px; }
        .integration-icon { font-size: 24px; color: var(--primary); }
        .integration-title { font-weight: 700; font-size: 15px; }
        .integration-desc { font-size: 12px; color: var(--text-muted); }
        .btn-outline { border: 1px solid var(--primary); background: transparent; color: var(--primary); padding: 6px 15px; border-radius: 3px; font-weight: 700; cursor: pointer; }

    </style>
</head>
<body>
    <aside class="sidebar">
        <!-- Minified sidebar -->
        <div class="logo-container">
            <div class="logo"><div class="logo-outer"></div><div class="logo-middle"></div><div class="logo-inner"></div></div>
            <div class="brand"><h2>SIGNYBON</h2></div>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-file-signature"></i><span>Werkbonnen</span></a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-gear"></i><span>Instellingen</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <h1>Systeemconfiguratie</h1>
            <button class="btn-primary">Wijzigingen Opslaan</button>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Bedrijfsidentiteit</h2></div>
            <div class="panel-body">
                <div class="row">
                    <div class="form-group" style="flex: 0 0 auto;">
                        <label>Bedrijfslogo</label>
                        <div class="logo-box"><i class="fa-solid fa-image" style="color: #adb5bd; font-size: 24px;"></i></div>
                        <button class="btn-outline" style="width: 100%; font-size: 12px;">Uploaden</button>
                    </div>
                    <div class="form-group">
                        <label>Bedrijfsnaam</label>
                        <input type="text" class="form-control" value="Peeters Bouw NV" style="margin-bottom: 20px;">
                        <label>Ondernemingsnummer (BTW)</label>
                        <input type="text" class="form-control" value="BE 0456.123.789">
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Adresgegevens</h2></div>
            <div class="panel-body">
                <div class="row">
                    <div class="form-group" style="flex: 3;"><label>Straat</label><input type="text" class="form-control" value="Bouwweg"></div>
                    <div class="form-group" style="flex: 1;"><label>Huisnummer</label><input type="text" class="form-control" value="44A"></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>Postcode</label><input type="text" class="form-control" value="1000"></div>
                    <div class="form-group"><label>Woonplaats</label><input type="text" class="form-control" value="Brussel"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Systeem Integraties</h2></div>
            <div class="panel-body">
                <div class="integration-box">
                    <div class="integration-meta">
                        <i class="fa-solid fa-file-invoice integration-icon"></i>
                        <div>
                            <div class="integration-title">Billit</div>
                            <div class="integration-desc">Koppel uw account voor directe facturatie export.</div>
                        </div>
                    </div>
                    <button class="btn-outline">Configureren</button>
                </div>
                <div class="integration-box">
                    <div class="integration-meta">
                        <i class="fa-solid fa-calculator integration-icon"></i>
                        <div>
                            <div class="integration-title">Exact Online</div>
                            <div class="integration-desc">Synchroniseer klanten en werkbon data.</div>
                        </div>
                    </div>
                    <button class="btn-outline">Configureren</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
