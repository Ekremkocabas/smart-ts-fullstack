<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen - Signybon (Construction)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1B4332;
            --primary-dark: #081C15;
            --accent: #D4A017;
            --accent-light: #FFD23F;
            --bg-color: #F0F2F5;
            --sidebar-bg: #081C15;
            --card-bg: #FFFFFF;
            --text-main: #2B2D42;
            --text-muted: #6C757D;
            --border-color: #DEE2E6;
            --border-radius: 8px;
            --border-width: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; font-family: 'Open Sans', sans-serif; }
        h1, h2, h3, .brand h2, .btn, .lbl { font-family: 'Montserrat', sans-serif; }

        /* Sidebar - Minified */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: #FFF; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 4px solid var(--accent); }
        .logo-box { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { width: 60px; height: 60px; margin: 0 auto 15px; position: relative; transform: rotate(45deg); display: flex; justify-content: center; align-items: center; }
        .logo-outer { width: 100%; height: 100%; background: var(--accent); position: absolute; }
        .logo-middle { width: 70%; height: 70%; background: var(--primary); position: absolute; z-index: 1; }
        .logo-inner { width: 40%; height: 40%; background: var(--accent); position: absolute; z-index: 2; }
        .brand h2 { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .nav-menu { padding: 20px 15px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; margin-bottom: 8px; border-radius: 6px; color: #ADB5BD; text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-item.active { background: var(--primary); color: var(--accent-light); border-left: 6px solid var(--accent); padding-left: 14px; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 40px; max-width: 1000px; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; border-bottom: var(--border-width) solid var(--text-main); padding-bottom: 15px; }
        .page-header h1 { font-size: 32px; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 5px; }

        .btn { padding: 12px 25px; border-radius: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border: none; cursor: pointer; font-size: 14px; }
        .btn-gold { background: var(--accent); color: #000; box-shadow: 4px 4px 0 var(--primary-dark); transition: transform 0.1s; }
        .btn-gold:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--primary-dark); }
        .btn-outline { background: transparent; border: 2px solid var(--text-muted); color: var(--text-main); }

        .settings-block { background: var(--card-bg); border-radius: var(--border-radius); border: var(--border-width) solid var(--primary-dark); padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .settings-block h2 { font-size: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 25px; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; }
        .settings-block h2::before { content: ""; display: block; width: 10px; height: 20px; background: var(--accent); }

        /* Form Fields */
        .form-row { display: flex; gap: 30px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        .lbl { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; letter-spacing: 0.5px; }
        .inp { width: 100%; padding: 12px 15px; border: var(--border-width) solid var(--border-color); border-radius: 4px; font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 14px; color: var(--text-main); outline: none; transition: border-color 0.2s; }
        .inp:focus { border-color: var(--primary); }

        /* Logo Area */
        .logo-area { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .logo-preview { width: 90px; height: 90px; border: 2px dashed var(--text-muted); display: flex; justify-content: center; align-items: center; border-radius: 8px; background: #F8F9FA; }
        
        /* Integrations */
        .integration-card { border: var(--border-width) solid var(--border-color); padding: 20px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; transition: border-color 0.2s; }
        .integration-card:hover { border-color: var(--accent); }
        .int-logo { width: 50px; height: 50px; background: #E9ECEF; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--primary-dark); }
        .int-info { flex: 1; margin: 0 20px; }
        .int-info h3 { font-size: 16px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .int-info p { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <!-- Minified for brevity -->
        <div class="logo-box">
            <div class="logo"><div class="logo-outer"></div><div class="logo-middle"></div><div class="logo-inner"></div></div>
            <div class="brand"><h2>Signybon</h2></div>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item"><i class="fa-solid fa-hard-hat"></i> Dashboard</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-screwdriver-wrench"></i> Gereedschap</a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-gear"></i> Instellingen</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Bedrijfsinstellingen</h1>
            <button class="btn btn-gold"><i class="fa-solid fa-floppy-disk"></i> Opslaan</button>
        </div>

        <div class="settings-block">
            <h2>Bedrijfs Profiel</h2>
            <div class="logo-area">
                <div class="logo-preview"><i class="fa-solid fa-camera" style="font-size:24px; color:#ADB5BD;"></i></div>
                <div>
                    <button class="btn btn-outline" style="margin-bottom: 10px;">Logo Uploaden</button>
                    <p style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Max. bestandsgrootte: 5MB</p>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group"><label class="lbl">Naam Onderneming</label><input type="text" class="inp" value="Peeters Bouw NV"></div>
                <div class="form-group"><label class="lbl">BTW Nummer</label><input type="text" class="inp" value="BE 0456.123.789"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="lbl">Hoofd Contactpersoon</label><input type="text" class="inp" value="Jan Peeters"></div>
                <div class="form-group"><label class="lbl">Werkbon E-mail</label><input type="email" class="inp" value="werkbonnen@peetersbouw.be"></div>
            </div>
        </div>

        <div class="settings-block">
            <h2>Hoofdkantoor Adres</h2>
            <div class="form-row">
                <div class="form-group" style="flex: 2;"><label class="lbl">Straat</label><input type="text" class="inp" value="Bouwweg"></div>
                <div class="form-group"><label class="lbl">Huisnummer</label><input type="text" class="inp" value="44A"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="lbl">Postcode</label><input type="text" class="inp" value="1000"></div>
                <div class="form-group"><label class="lbl">Gemeente</label><input type="text" class="inp" value="Brussel"></div>
            </div>
        </div>

        <div class="settings-block">
            <h2>Boekhoudkoppelingen</h2>
            <div class="integration-card">
                <div class="int-logo"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                <div class="int-info">
                    <h3>Billit Connect</h3>
                    <p>Stuur goedgekeurde werkbonnen direct door als conceptfactuur.</p>
                </div>
                <button class="btn btn-outline">Koppelen</button>
            </div>
            <div class="integration-card">
                <div class="int-logo"><i class="fa-solid fa-calculator"></i></div>
                <div class="int-info">
                    <h3>Exact Online</h3>
                    <p>Synchroniseer uw klantenbestand automatisch.</p>
                </div>
                <button class="btn btn-outline">Koppelen</button>
            </div>
        </div>

    </main>
</body>
</html>
