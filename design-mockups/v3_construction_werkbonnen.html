<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkbonnen - Signybon (Construction)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1B4332;
            --primary-dark: #081C15;
            --accent: #D4A017;
            --accent-light: #FFD23F;
            --bg-color: #F0F2F5;
            --sidebar-bg: #081C15;
            --card-bg: #FFFFFF;
            --text-main: #2B2D42;
            --text-muted: #6C757D;
            --border-color: #DEE2E6;
            --border-radius: 8px;
            --border-width: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; font-family: 'Open Sans', sans-serif; }
        h1, h2, h3, .brand h2, th, .btn { font-family: 'Montserrat', sans-serif; }

        .sidebar { width: 280px; background: var(--sidebar-bg); color: #FFF; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 4px solid var(--accent); }
        .logo-box { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { width: 60px; height: 60px; margin: 0 auto 15px; position: relative; transform: rotate(45deg); display: flex; justify-content: center; align-items: center; }
        .logo-outer { width: 100%; height: 100%; background: var(--accent); position: absolute; }
        .logo-middle { width: 70%; height: 70%; background: var(--primary); position: absolute; z-index: 1; }
        .logo-inner { width: 40%; height: 40%; background: var(--accent); position: absolute; z-index: 2; }
        .brand h2 { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .nav-menu { padding: 20px 15px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; margin-bottom: 8px; border-radius: 6px; color: #ADB5BD; text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-item.active { background: var(--primary); color: var(--accent-light); border-left: 6px solid var(--accent); padding-left: 14px; }
        .nav-item i { width: 22px; font-size: 18px; text-align: center; }

        .main-content { flex: 1; padding: 40px; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: var(--border-width) solid var(--text-main); padding-bottom: 15px; }
        .page-header h1 { font-size: 32px; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 5px; }
        
        .filters-bar { background: var(--text-main); padding: 15px 20px; border-radius: var(--border-radius); display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 4px solid var(--accent); flex-wrap: wrap; }
        .filter-select { padding: 10px 15px; border-radius: 4px; border: none; font-weight: 600; font-family: 'Open Sans', sans-serif; background: #FFF; outline: none; }
        
        .btn { padding: 10px 20px; border-radius: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border: none; cursor: pointer; font-size: 13px; }
        .btn-gold { background: var(--accent); color: #000; }
        .btn-green { background: var(--primary); color: #FFF; }

        .table-wrap { background: var(--card-bg); border-radius: var(--border-radius); border: var(--border-width) solid var(--primary-dark); overflow: hidden; margin-bottom: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-table { width: 100%; border-collapse: collapse; }
        .main-table th { background: #F8F9FA; padding: 15px; text-align: left; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); border-bottom: var(--border-width) solid var(--primary-dark); }
        .main-table td { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 14px; }
        .main-table tr:hover { background-color: rgba(212, 160, 23, 0.05); }

        .status-pill { display: inline-block; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 800; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .st-signed { background: var(--accent); color: #000; border: 1px solid #C4910C; }
        .st-sent { background: #28A745; color: #FFF; }
        .st-concept { background: #E9ECEF; color: var(--text-main); }
        
        .type-tag { padding: 4px 8px; font-size: 11px; font-weight: 800; border-radius: 2px; border-left: 4px solid; background: #F8F9FA; color: var(--text-main); }
        .type-tag.uren { border-color: #0D6EFD; }
        .type-tag.dag { border-color: #FD7E14; }
        .type-tag.prestatie { border-color: #6F42C1; }
        
    </style>
</head>
<body>
    <aside class="sidebar">
        <!-- Minified for brevity -->
        <div class="logo-box">
            <div class="logo"><div class="logo-outer"></div><div class="logo-middle"></div><div class="logo-inner"></div></div>
            <div class="brand"><h2>Signybon</h2></div>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item"><i class="fa-solid fa-hard-hat"></i> Dashboard</a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-clipboard-list"></i> Werkbonnen</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-building"></i> Klanten</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Werkbonnen Archief</h1>
            <button class="btn btn-gold"><i class="fa-solid fa-plus"></i> Nieuwe Werkbon</button>
        </div>

        <div class="filters-bar">
            <select class="filter-select"><option>Huidige Week (W14)</option><option>Vorige Week (W13)</option></select>
            <select class="filter-select"><option>Alle Statussen</option><option>Ondertekend</option><option>Concept</option></select>
            <select class="filter-select"><option>Alle Types</option><option>Uren (\u25a0)</option><option>Dagregie (\u25a0)</option></select>
            <select class="filter-select"><option>Alle Vakmannen</option></select>
            <input type="text" class="filter-select" placeholder="Zoeken..." style="flex: 1;">
            <button class="btn btn-green"><i class="fa-solid fa-magnifying-glass"></i> Toepassen</button>
        </div>

        <div class="table-wrap">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Vakman</th>
                        <th>Werf & Locatie</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actie</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-family: 'Montserrat', sans-serif; font-weight: 800;">WB-001</td>
                        <td>Jens De Smet</td>
                        <td>Kantoorgebouw Zuidas<br><small style="color:var(--text-muted)">Antwerpen</small></td>
                        <td><span class="type-tag uren">UREN</span></td>
                        <td><span class="status-pill st-signed">Ondertekend</span></td>
                        <td><button class="btn btn-green" style="padding: 6px 12px; font-size:11px;">Open</button></td>
                    </tr>
                    <tr>
                        <td style="font-family: 'Montserrat', sans-serif; font-weight: 800;">WB-002</td>
                        <td>Kevin Vandevelde</td>
                        <td>Renovatie Park<br><small style="color:var(--text-muted)">Antwerpen</small></td>
                        <td><span class="type-tag dag">DAG</span></td>
                        <td><span class="status-pill st-sent">Verzonden</span></td>
                        <td><button class="btn btn-green" style="padding: 6px 12px; font-size:11px;">Open</button></td>
                    </tr>
                    <tr>
                        <td style="font-family: 'Montserrat', sans-serif; font-weight: 800;">WB-003</td>
                        <td>Tom Peeters</td>
                        <td>Villa Kempen<br><small style="color:var(--text-muted)">Kempen</small></td>
                        <td><span class="type-tag prestatie">PRESTATIE</span></td>
                        <td><span class="status-pill st-concept">Concept</span></td>
                        <td><button class="btn btn-green" style="padding: 6px 12px; font-size:11px;">Bewerk</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
